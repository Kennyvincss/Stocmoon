name: Intraday operator (5m-4H markets)

# Runs services/src/operator.ts in the cloud during US market hours (Mon-Fri), so no PC needs to stay on.
# GitHub limits a job to 6 hours, so the session is covered by two back-to-back runs. The concurrency group
# queues the second run until the first exits — only one operator runs at a time.
# Covers 13:25-21:20 UTC, i.e. 09:30-16:00 ET in both winter (EST) and summer (EDT) time.
# Free for public repositories. Requires secrets: OPERATOR_PRIVATE_KEY, ALPACA_API_KEY_ID, ALPACA_API_SECRET.
on:
  schedule:
    - cron: "25 13 * * 1-5"
    - cron: "5 19 * * 1-5"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Max runtime in minutes (<= 350)"
        default: "350"

concurrency:
  group: intraday-operator
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CHAIN_ID: "84532"
      RPC_URL: https://sepolia.base.org
      OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      INTRADAY_DURATIONS: "300,900,3600"
      INTRADAY_LIQUIDITY: "5000000"
      # first run lasts until ~19:15 UTC; the 19:05 run waits in the queue and then covers the close
      OPERATOR_MAX_RUNTIME_MIN: ${{ github.event.inputs.minutes || (github.event.schedule == '25 13 * * 1-5' && '350' || '135') }}
    steps:
      - name: Check secrets
        run: |
          for v in OPERATOR_PRIVATE_KEY ALPACA_API_KEY_ID ALPACA_API_SECRET; do
            if [ -z "${!v}" ]; then echo "::warning::$v secret not set; skipping"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
          done
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: pnpm/action-setup@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter services...
        if: env.SKIP != '1'
      - name: Run operator
        if: env.SKIP != '1'
        run: pnpm --filter services exec tsx src/operator.ts
