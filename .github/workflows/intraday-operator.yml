name: Intraday operator (5m-4H markets)

# Runs services/src/operator.ts in the cloud during extended US trading hours (04:00-20:00 ET, Mon-Fri), so no PC
# needs to stay on. GitHub limits a job to 6 hours, so the day is covered by three back-to-back runs; the concurrency
# group queues each run until the previous one exits, so only one operator runs at a time.
# Covers ~07:55-01:25 UTC, i.e. 04:00-20:00 ET in both winter (EST) and summer (EDT) time.
# Free for public repositories. Requires secrets: OPERATOR_PRIVATE_KEY, ALPACA_API_KEY_ID, ALPACA_API_SECRET.
# NOTE: scheduled runs were removed — GitHub started them many hours late. The always-on bot (docs/ORACLE.md)
# runs the intraday operator now; this workflow remains as a manual backup (Actions → Run workflow).
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Max runtime in minutes (<= 350)"
        default: "350"

concurrency:
  group: intraday-operator
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CHAIN_ID: "84532"
      RPC_URL: https://sepolia.base.org
      OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      INTRADAY_DURATIONS: "300,900,3600"
      INTRADAY_LIQUIDITY: "5000000"
      INTRADAY_HOURS: extended
      # each run lasts ~5h50m; the next scheduled run waits in the queue and takes over
      OPERATOR_MAX_RUNTIME_MIN: ${{ github.event.inputs.minutes || '350' }}
    steps:
      - name: Check secrets
        run: |
          for v in OPERATOR_PRIVATE_KEY ALPACA_API_KEY_ID ALPACA_API_SECRET; do
            if [ -z "${!v}" ]; then echo "::warning::$v secret not set; skipping"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
          done
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: pnpm/action-setup@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter services...
        if: env.SKIP != '1'
      - name: Run operator
        if: env.SKIP != '1'
        run: pnpm --filter services exec tsx src/operator.ts
